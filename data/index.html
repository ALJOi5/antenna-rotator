<!DOCTYPE html>
<html>

<head>
    <title>ESP32 Satellite Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg: #0d0f0e;
            --accent: #4cff91;
            --border: #2a3329;
            --panel: #111512;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--accent);
            font-family: monospace;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
        }

        #top-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #gps-status {
            font-size: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
        }

        #menu-buttons {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .menu-btn {
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 16px;
        }

        .menu-btn:hover {
            opacity: 0.7;
        }

        .main-container {
            display: flex;
            flex: 1;
            gap: 20px;
            min-height: 0;
        }

        #sidebar {
            flex: 1;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        #map {
            flex: 2.5;
            background: #111;
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        #console {
            height: 180px;
            background: #000;
            overflow-y: auto;
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 13px;
        }

        .sat-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--accent);
            padding: 12px;
            cursor: pointer;
            text-align: left;
            font-family: monospace;
            border-radius: 8px;
            transition: 0.2s;
        }

        .sat-btn-active {
            background: rgba(76, 255, 145, 0.1);
            border-color: var(--accent);
        }


        .sat-btn:hover {
            background: rgba(76, 255, 145, 0.1);
            border-color: var(--accent);
        }

        .sat-btn span {
            color: #5a7055;
            font-size: 10px;
            display: block;
            margin-top: 4px;
        }

        .ts {
            color: #5a7055;
            margin-right: 10px;
        }

        .log-entry {
            margin-bottom: 6px;
        }

        h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            text-transform: uppercase;
            color: #5a7055;
        }

        #settings-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #settings-panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 30px;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #settings-close {
            margin-top: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            justify-content: center;
        }

        .cfg-input {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--accent);
            font-family: monospace;
            padding: 6px 10px;
            width: 120px;
            text-align: right;
        }

        .cfg-input:focus {
            outline: none;
            border-color: var(--accent);
        }
    </style>
</head>

<body>
    <div id="top-row">
        <div id="gps-status">GPS SEARCHING...</div>
        <div id="menu-buttons">
            <div class="menu-btn" onclick="panHome()" role="button" tabindex="0">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12 7 2"/><path d="m7 12 5-10"/>
                    <path d="m12 12 5-10"/><path d="m17 12 5-10"/>
                    <path d="M4.5 7h15"/><path d="M12 16v6"/>
                </svg>
            </div>
            <div class="menu-btn" onclick="panSat()" role="button" tabindex="0">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m13.5 6.5-3.148-3.148a1.205 1.205 0 0 0-1.704 0L6.352 5.648a1.205 1.205 0 0 0 0 1.704L9.5 10.5" />
                    <path d="M16.5 7.5 19 5" />
                    <path d="m17.5 10.5 3.148 3.148a1.205 1.205 0 0 1 0 1.704l-2.296 2.296a1.205 1.205 0 0 1-1.704 0L13.5 14.5" />
                    <path d="M9 21a6 6 0 0 0-6-6" />
                    <path d="M9.352 10.648a1.205 1.205 0 0 0 0 1.704l2.296 2.296a1.205 1.205 0 0 0 1.704 0l4.296-4.296a1.205 1.205
                        0 0 0 0-1.704l-2.296-2.296a1.205 1.205 0 0 0-1.704 0z" />
                </svg>
            </div>
            <div class="menu-btn" onclick="openSettings()" role="button" tabindex="0">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3" />
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06
                        a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09
                        A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83
                        l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09
                        A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83
                        l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09
                        a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83
                        l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09
                        a1.65 1.65 0 0 0-1.51 1z" />
                </svg>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div id="sidebar">
            <h3>Target Selection</h3>
            <div id="sat-list" style="display: flex; flex-direction: column; gap: 10px;"></div>
        </div>
        <div id="map"></div>
    </div>
    <div id="console"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([0, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        const marker = L.marker([0, 0]).addTo(map);
        const baseMarker = L.marker([46.049358, 14.503285]).addTo(map)
        const gateway = `ws://${window.location.hostname}/ws`;
        let socket;
        let positionBuffer = [];
        let playbackInterval;
        let activeSatName = "Unknown";

        async function updateGpsStatus() {
            try {
                const res = await fetch('/gps');
                const d = await res.json();
                const el = document.getElementById('gps-status');
                el.textContent = d.locked
                    ? `GPS LOCKED - ${d.sats} sats | ${d.lat.toFixed(6)}, ${d.lng.toFixed(6)} | alt: ${d.alt}m`
                    : `GPS SEARCHING... (fallback coords) | ${d.lat.toFixed(4)}, ${d.lng.toFixed(4)}`;
                el.style.color = d.locked ? '#4cff91' : '#ff9f43';
                baseMarker.setLatLng([d.lat.toFixed(6), d.lng.toFixed(6)])
            } catch (e) { }
        }

        async function loadSats() {
            try {
                const response = await fetch('/sats.json');
                const sats = await response.json();
                const container = document.getElementById('sat-list');
                const buttons = [];

                sats.forEach(sat => {
                    const btn = document.createElement('button');
                    btn.className = 'sat-btn';
                    btn.innerHTML = `${sat.name} <span>NORAD ID: ${sat.id}</span>`;
                    btn.onclick = () => {
                        socket.send(`TRACK:${sat.id}`);
                        buttons.forEach(b => b.classList.remove('sat-btn-active'));
                        btn.classList.add('sat-btn-active');
                    };
                    buttons.push(btn);
                    container.appendChild(btn);
                });
            } catch (e) { }
        }


        function startPlayback() {
            clearInterval(playbackInterval);
            playbackInterval = setInterval(() => {
                if (positionBuffer.length > 0) {
                    const next = positionBuffer.shift();
                    const pos = [next.satlatitude, next.satlongitude];
                    marker.setLatLng(pos);
                    if (trackSat) {map.panTo(pos);}
                    const consoleEl = document.getElementById('console');
                    consoleEl.innerHTML += `<div class="log-entry">
                    <span class="ts">[${new Date().toLocaleTimeString()}]</span>
                    <strong>${activeSatName}</strong>: ${next.satlatitude.toFixed(6)}, ${next.satlongitude.toFixed(6)}
                </div>`;
                    consoleEl.scrollTop = consoleEl.scrollHeight;
                }
            }, 1000);
        }

        function initWebSocket() {
            socket = new WebSocket(gateway);
            socket.onopen = () => {
                document.getElementById('console').innerHTML += '<div class="log-entry">> SYNCED</div>';
            };
            socket.onclose = () => setTimeout(initWebSocket, 2000);
            socket.onmessage = function (event) {
                try {
                    const data = JSON.parse(event.data);
                    if (data.positions && data.info) {
                        activeSatName = data.info.satname;
                        positionBuffer = data.positions;
                        startPlayback();
                    }
                } catch (e) {
                    document.getElementById('console').innerHTML += `<div class="log-entry">> ${event.data}</div>`;
                }
            };
        }

        async function openSettings() {
            try {
                const res = await fetch('/config.json');
                const config = await res.json();
                const content = document.getElementById('settings-content');
                content.innerHTML = Object.entries(config).map(([category, fields]) => `
                    <div style="margin-bottom: 16px;">
                        <h3>${category}</h3>
                        ${Object.entries(fields).map(([key, val]) => `
                            <div class="log-entry" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                                <span class="ts">${key}</span>
                                <input class="cfg-input" data-category="${category}" data-key="${key}" value="${val}" type="number" step="any"/>
                            </div>
                        `).join('')}
                    </div>
                `).join('');
            } catch (e) {
                document.getElementById('settings-content').innerHTML = 'Failed to load config.json';
            }
            document.getElementById('settings-overlay').style.display = 'flex';
        }

        async function saveSettings() {
            const inputs = document.querySelectorAll('.cfg-input');
            const config = {};
            inputs.forEach(input => {
                const cat = input.dataset.category;
                const key = input.dataset.key;
                if (!config[cat]) config[cat] = {};
                config[cat][key] = parseFloat(input.value);
            });
            try {
                await fetch('/config.json', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });
                closeSettings();
            } catch (e) {
                alert('Save failed');
            }
        }

        function closeSettings() {
            document.getElementById('settings-overlay').style.display = 'none';
        }

        function panHome() {
            map.flyTo(baseMarker.getLatLng(), 16);
        }
        
        let trackSat = false;
        function panSat() {
            trackSat = !trackSat;
            const btn = document.querySelector('[onclick="panSat()"]');
            btn.style.borderColor = trackSat ? 'var(--accent)' : 'var(--border)';
            if (trackSat) {
                map.flyTo(marker.getLatLng(), 4);
            }
        }

        window.onload = () => {
            initWebSocket();
            loadSats();
            updateGpsStatus();
            setInterval(updateGpsStatus, 3000);
        };
    </script>

    <div id="settings-overlay" style="display:none;">
        <div id="settings-panel">
            <h3>Settings</h3>
            <div id="settings-content"></div>
            <div id="settings-close" class="menu-btn" onclick="saveSettings()">save</div>
            <div class="menu-btn" onclick="closeSettings()">cancel</div>
        </div>
    </div>
</body>

</html>
